name: deb
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make git curl xz-utils unzip fakeroot dpkg-dev clang perl
          df -h /

      - name: theos
        run: |
          set -x
          curl -fsSL --retry 3 https://codeload.github.com/theos/theos/zip/refs/heads/master -o /tmp/theos.zip
          unzip -q /tmp/theos.zip -d /tmp
          mv /tmp/theos-master "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          mkdir -p "$HOME/theos/sdks"
          curl -fsSL --retry 3 https://codeload.github.com/theos/sdks/zip/refs/heads/master -o /tmp/sdks.zip
          mkdir -p /tmp/s
          unzip -q /tmp/sdks.zip -d /tmp/s
          mv /tmp/s/sdks-master/*.sdk "$HOME/theos/sdks/" || true
          rm -f /tmp/theos.zip /tmp/sdks.zip
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          ls "$HOME/theos/sdks"
          df -h /

      - name: ldid
        run: |
          mkdir -p "$HOME/theos/bin"
          curl -fsSL --retry 3 "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o "$HOME/theos/bin/ldid"
          chmod +x "$HOME/theos/bin/ldid"
          "$HOME/theos/bin/ldid" -h || true

      - name: build
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: list
        if: always()
        run: ls -lh packages/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
          if-no-files-found: warn
