name: deb
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make git curl xz-utils unzip fakeroot dpkg-dev clang perl
          clang --version

      - name: theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          test -d "$HOME/theos/makefiles"
          test -d "$HOME/theos/sdks"
          echo "theos 就绪"

      - name: ldid
        run: |
          mkdir -p "$HOME/theos/bin"
          curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o "$HOME/theos/bin/ldid"
          chmod +x "$HOME/theos/bin/ldid"
          "$HOME/theos/bin/ldid" -h || true

      - name: build
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: list
        if: always()
        run: ls -lh packages/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
          if-no-files-found: warn
